async function redeemCode(){
 const code=document.getElementById('codeInput').value.trim();
 if(!code) return;

 // Codes de confort : ne donnent AUCUNE récompense, changent juste le niveau
 // d'IA affronté. Sans risque de triche, donc laissés ici.
 const aiCodes={'384921':1,'715846':2,'268593':3,'907314':4,'641875':5,'827461':6,'593718':7,'764239':8,'918472':9,'375981':10};
 if(code in aiCodes){ aiForced=true; aiDifficulty=aiCodes[code]; alert('🤖 IA Niveau '+aiCodes[code]+' forcé'); return; }
 if(code==='112358'){ aiForced=false; alert('🤖 IA revenue en mode automatique'); return; }

 // Tout code donnant une récompense (points/diamants) doit exister dans la
 // table gift_codes de Supabase. Plus aucun code n'est écrit en dur ici :
 // personne ne peut plus les trouver en lisant le fichier du jeu.
 try{
   const r=await fetch(
     SUPABASE_URL+'gift_codes?code=eq.'+encodeURIComponent(code)+'&select=*',
     {headers:{
       'apikey':SUPABASE_PUBLISHABLE_KEY,
       'Authorization':'Bearer '+SUPABASE_PUBLISHABLE_KEY
     }}
   );
   const rows=await r.json();

   if(Array.isArray(rows) && rows.length>0){
      const gift=rows[0];
      if(!gift.active){ alert('❌ Code désactivé'); return; }
      if((gift.uses||0) >= (gift.max_uses||1)){ alert('❌ Code déjà utilisé'); return; }

      if(gift.reward_type==='diamonds') diamonds += gift.reward_value;
      if(gift.reward_type==='points') points += gift.reward_value;

      await fetch(
        SUPABASE_URL+'gift_codes?id=eq.'+gift.id,
        {
          method:'PATCH',
          headers:{
            'apikey':SUPABASE_PUBLISHABLE_KEY,
            'Authorization':'Bearer '+SUPABASE_PUBLISHABLE_KEY,
            'Content-Type':'application/json'
          },
          body:JSON.stringify({uses:(gift.uses||0)+1})
        }
      );

      saveGame();
      alert('🎁 Récompense obtenue !');
      return;
   }
 }catch(e){
   console.log(e);
 }

 alert('❌ Code invalide');
}

let dailyRewards=JSON.parse(localStorage.getItem(accKey('dailyRewards'))||'{}');

(function settleWeeklyReward(){
 const currentWeek=new Date().getFullYear()+'-'+Math.floor(Date.now()/604800000);
 Object.keys(dailyRewards).forEach(week=>{
   if(week===currentWeek) return;
   const data=dailyRewards[week];
   if(!data || data.rewarded) return;
   const progress=(data.claimed||[]).length;
   if(progress===1){ diamonds+=5; }
   else if(progress===2){ diamonds+=6; }
   else if(progress===3){ diamonds+=15; }
   else if(progress===4){ diamonds+=10; buyChest(20,true); }
   else if(progress===5){ diamonds+=10; buyChest(80,true); }
   else if(progress===6){ buyChest(80,true); buyChest(80,true); }
   else if(progress>=7){ buyChest(200,true); }

   data.rewarded=true;
   alert('🏆 Fin de semaine !\n\nRécompense obtenue : '+(
      progress===1?'💎 5':
      progress===2?'💎 6':
      progress===3?'💎 15':
      progress===4?'📦 Commun + 💎10':
      progress===5?'📦 Rare + 💎10':
      progress===6?'📦 Rare x2':
      progress>=7?'📦 Légendaire':'Aucune'
   ));
 });
 localStorage.setItem(accKey('dailyRewards'),JSON.stringify(dailyRewards));
})();


function showDailyRewards(){
 const today=new Date().toISOString().slice(0,10);
 const weekKey=new Date().getFullYear()+'-'+Math.floor(Date.now()/604800000);

 if(!dailyRewards[weekKey]) dailyRewards[weekKey]={claimed:[]};

 let claimed=dailyRewards[weekKey].claimed||[];
 let progress=claimed.length;

 const rewards=[null,'💎 5','💎 6','💎 15','📦 Commun + 💎10','📦 Rare + 💎10','📦 Rare x2','📦 Légendaire'];

 let txt='🎁 RÉCOMPENSE HEBDOMADAIRE\n\n';

 for(let i=1;i<=7;i++){
   txt+=(i<=progress?'✅ ':'⬜ ');
 }
 txt+='\n\n'+progress+'/7 connexions cette semaine\n\n';

 txt+='1/7 → 💎 5\n';
 txt+='2/7 → 💎 6\n';
 txt+='3/7 → 💎 15\n';
 txt+='4/7 → 📦 Commun + 💎10\n';
 txt+='5/7 → 📦 Rare + 💎10\n';
 txt+='6/7 → 📦 Rare x2\n';
 txt+='7/7 → 📦 Légendaire\n\n';

 txt+='⚠️ Une seule connexion compte par jour.\n';
 txt+='⚠️ Une seule récompense sera donnée en fin de semaine.\n\n';
 txt+='🎯 Récompense actuelle : '+(progress===0?'Aucune':rewards[progress]);

 if(claimed.includes(today)){
   alert(txt);
   return;
 }

 if(!confirm(txt+'\n\nValider la connexion du jour ?')) return;

 claimed.push(today);
 dailyRewards[weekKey].claimed=claimed;

 localStorage.setItem(accKey('dailyRewards'),JSON.stringify(dailyRewards));
 saveGame();

 alert('✅ Connexion enregistrée !\n\nProgression : '+claimed.length+'/7');
}

function renderUnits(){
teamInfo.innerHTML="Équipe : "+equipped.map(x=>allUnits[x].name+" Lv."+levels[x]).join(" ");
unitList.innerHTML='';
Object.keys(allUnits).forEach(k=>{
 let b=document.createElement('button');
 const locked=((['mage','sniper','electromancer','cryomancer','pyromancer','mole','cavalier'].includes(k)) && !unlocked.includes(k));
 b.textContent=locked && k==='mole' ? '🔒 ??? 🟠 Légendaire' : (locked?'🔒 ':'')+allUnits[k].name+' '+(rarities[k]?rarities[k][0]+' '+rarities[k][1]:'')+' Lv.'+(levels[k]||1)+' 💰'+allUnits[k].cost;
 if(locked){ b.disabled=true; unitList.appendChild(b); return; }
 b.className='unitBtn'+(equipped.includes(k)?' active':'');
 b.onclick=()=>{
  if(equipped.includes(k)){if(equipped.length>1) equipped=equipped.filter(x=>x!==k);}

  renderUnits();
 };
 unitList.appendChild(b);
});
}

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let gold=30,enemyGold=30,score=0,selectedLane=0,gameOver=false,gameResult='';

// ==================== SYSTÈME DE SPRITES PRÉ-RENDUS ====================
// Chaque unité est dessinée UNE SEULE FOIS par frame d'animation sur un
// mini-canvas, puis le rendu en jeu se contente d'un drawImage (très rapide).
// Cela élimine le tremblement / lag causé par des dizaines de formes
// recalculées à chaque frame pour chaque unité affichée.

const SPRITE_SIZE = 120;
const SPRITE_CENTER = 60;
const SPRITE_ANIM_FRAMES = 8; // 8 frames = cache très efficace
const spriteCache = {};        // clé: "type|anim|team|frame" -> canvas

function renderUnitSprite(sctx, type, x, y, tk, attacking, team, dead){
const t=type;
const ctx=sctx;
const dir=1;
const sp_ratio=1;
const burrow_val=0;
const bob=Math.sin(tk*0.13)*2;
const walk=Math.sin(tk*0.18);

// Reset styles canvas
ctx.save();
ctx.setLineDash([]); ctx.lineCap='butt'; ctx.lineJoin='miter';
ctx.lineWidth=1; ctx.shadowBlur=0; ctx.globalAlpha=1;

if(t==='knight'||t==='guardian'){
  const col=t==='guardian'?'#3a7acc':'#6a8fa8';
  const dark=t==='guardian'?'#1a4a88':'#3a5a70';
  const leg1=walk*7, leg2=-walk*7;
  // Ombre
  ctx.fillStyle='rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.ellipse(x,y+28,16,4,0,0,6.28); ctx.fill();
  // Jambes
  ctx.fillStyle=dark;
  ctx.beginPath(); ctx.roundRect(x-10,y+8+leg1,9,16,2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(x+1,y+8+leg2,9,16,2); ctx.fill();
  // Pieds
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.roundRect(x-12,y+22+leg1,11,5,1); ctx.fill();
  ctx.beginPath(); ctx.roundRect(x+1,y+22+leg2,11,5,1); ctx.fill();
  // Corps armure
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.roundRect(x-12,y-12+bob,24,22,3); ctx.fill();
  // Reflet armure
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.roundRect(x-9,y-10+bob,8,10,2); ctx.fill();
  // Épaules
  ctx.fillStyle=t==='guardian'?'#2a6acc':'#5a7a90';
  ctx.beginPath(); ctx.arc(x-13,y-9+bob,6,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(x+13,y-9+bob,6,0,6.28); ctx.fill();
  // Bouclier guardian
  if(t==='guardian'){
    ctx.fillStyle='#1a4488';
    ctx.beginPath(); ctx.roundRect(x-26,y-16+bob,12,26,3); ctx.fill();
    ctx.fillStyle='#ffd700';
    ctx.beginPath(); ctx.arc(x-20,y-3+bob,4,0,6.28); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.roundRect(x-25,y-14+bob,4,10,2); ctx.fill();
  }
  // Casque
  ctx.fillStyle=dark;
  ctx.beginPath(); ctx.roundRect(x-9,y-30+bob,18,20,4); ctx.fill();
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.roundRect(x-7,y-28+bob,14,16,3); ctx.fill();
  // Visière
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.beginPath(); ctx.roundRect(x-5,y-23+bob,10,5,1); ctx.fill();
  // Crête casque guardian
  if(t==='guardian'){
    ctx.fillStyle='#cc4400';
    for(let i=0;i<5;i++) ctx.fillRect(x-4+i*2,y-34+bob-i%2*2,2,6);
  }
  // Épée
  const swingA=attacking?Math.sin(tk*0.25)*0.6:0;
  ctx.save(); ctx.translate(x+14,y-4+bob); ctx.rotate(swingA);
  ctx.fillStyle='#c8c8c8';
  ctx.beginPath(); ctx.roundRect(-2,-18,4,22,1); ctx.fill();
  ctx.fillStyle='#ffd700';
  ctx.beginPath(); ctx.roundRect(-5,-1,10,3,1); ctx.fill();
  ctx.fillStyle='#8b6914';
  ctx.beginPath(); ctx.roundRect(-2,1,4,7,1); ctx.fill();
  ctx.restore();

} else if(t==='cavalier'){
  const sp=(sp_ratio)/this.speed;
  const g=walk*8;
  const g2=-walk*8;

  // Ombre au sol
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(x+6,y+32,34,5,0,0,6.28); ctx.fill();

  // === CHEVAL ===
  // Queue (en fill, pas stroke)
  ctx.fillStyle='#4a2808';
  ctx.beginPath();
  ctx.moveTo(x-18,y+2);
  ctx.quadraticCurveTo(x-44,y+0+g*0.3,x-46,y+14+g*0.5);
  ctx.quadraticCurveTo(x-44,y+18+g*0.5,x-40,y+14+g*0.3);
  ctx.quadraticCurveTo(x-38,y+4,x-16,y+8);
  ctx.closePath(); ctx.fill();

  // Jambes arrière (derrière le corps)
  // Jambe arrière gauche
  ctx.fillStyle='#7b4a20';
  ctx.beginPath(); ctx.roundRect(x-14,y+10+g,10,18,3); ctx.fill();
  ctx.fillStyle='#5a3010';
  ctx.beginPath(); ctx.roundRect(x-15,y+26+g,12,7,2); ctx.fill();
  // Jambe arrière droite
  ctx.fillStyle='#7b4a20';
  ctx.beginPath(); ctx.roundRect(x-4,y+10+g2,10,18,3); ctx.fill();
  ctx.fillStyle='#5a3010';
  ctx.beginPath(); ctx.roundRect(x-5,y+26+g2,12,7,2); ctx.fill();

  // Corps principal du cheval
  ctx.fillStyle='#8b5a2b';
  ctx.beginPath(); ctx.ellipse(x+4,y+4,30,14,0,0,6.28); ctx.fill();
  // Flanc highlight
  ctx.fillStyle='rgba(255,200,140,0.15)';
  ctx.beginPath(); ctx.ellipse(x+8,y,22,9,0,0,6.28); ctx.fill();

  // Jambes avant (devant le corps)
  ctx.fillStyle='#8b5a2b';
  ctx.beginPath(); ctx.roundRect(x+10,y+10+g2,11,20,3); ctx.fill();
  ctx.fillStyle='#5a3010';
  ctx.beginPath(); ctx.roundRect(x+9,y+28+g2,13,7,2); ctx.fill();
  ctx.fillStyle='#8b5a2b';
  ctx.beginPath(); ctx.roundRect(x+22,y+10+g,11,20,3); ctx.fill();
  ctx.fillStyle='#5a3010';
  ctx.beginPath(); ctx.roundRect(x+21,y+28+g,13,7,2); ctx.fill();

  // Encolure
  ctx.fillStyle='#8b5a2b';
  ctx.beginPath();
  ctx.moveTo(x+22,y-2);
  ctx.quadraticCurveTo(x+32,y-16,x+34,y-8);
  ctx.lineTo(x+28,y+6);
  ctx.closePath(); ctx.fill();

  // Tête du cheval
  ctx.fillStyle='#7b4a20';
  ctx.beginPath(); ctx.ellipse(x+38,y-10,14,9,0.35,0,6.28); ctx.fill();
  // Museau
  ctx.fillStyle='#9a5828';
  ctx.beginPath(); ctx.ellipse(x+50,y-7,6,5,0.15,0,6.28); ctx.fill();
  // Narine
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(x+53,y-7,2,1.5,0.3,0,6.28); ctx.fill();
  // Oeil
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(x+34,y-13,3,0,6.28); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(x+35,y-14,1.2,0,6.28); ctx.fill();
  // Oreille
  ctx.fillStyle='#7b4a20';
  ctx.beginPath(); ctx.moveTo(x+30,y-18); ctx.lineTo(x+26,y-26); ctx.lineTo(x+34,y-20); ctx.closePath(); ctx.fill();
  // Crinière (fills seulement)
  ctx.fillStyle='#3a1e08';
  for(let i=0;i<6;i++){
    ctx.beginPath();
    ctx.ellipse(x+26-i*2.5, y-12+Math.sin(i*0.9+tk*0.1)*2, 4,7, 0.4,0,6.28);
    ctx.fill();
  }

  // === CAVALIER ===
  // Corps cavalier
  ctx.fillStyle='#2a4a7a';
  ctx.beginPath(); ctx.roundRect(x-2,y-26,16,18,3); ctx.fill();
  // Reflet armure
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.roundRect(x,y-24,6,10,2); ctx.fill();
  // Épaulettes
  ctx.fillStyle='#1a3a6a';
  ctx.beginPath(); ctx.arc(x-3,y-24,5,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(x+13,y-24,5,0,6.28); ctx.fill();
  // Casque
  ctx.fillStyle='#1a3a6a';
  ctx.beginPath(); ctx.roundRect(x-3,y-42,14,16,4); ctx.fill();
  ctx.fillStyle='#2a4a8a';
  ctx.beginPath(); ctx.roundRect(x-1,y-40,11,13,3); ctx.fill();
  // Visière
  ctx.fillStyle='rgba(0,0,0,0.65)';
  ctx.beginPath(); ctx.roundRect(x+1,y-33,8,5,1); ctx.fill();
  // Panache rouge
  ctx.fillStyle='#cc2200';
  for(let i=0;i<5;i++){
    const ph=8+Math.sin(i*0.7+tk*0.12)*3;
    ctx.beginPath();
    ctx.moveTo(x+i*2,y-42);
    ctx.lineTo(x-1+i*2,y-42-ph);
    ctx.lineTo(x+2+i*2,y-42);
    ctx.closePath(); ctx.fill();
  }
  // Lance (fill pas stroke)
  ctx.fillStyle='#7a5a10';
  ctx.save(); ctx.translate(x+12,y-20); ctx.rotate(-0.22);
  ctx.beginPath(); ctx.roundRect(-2,-2,40,4,1); ctx.fill();
  // Pointe lance
  ctx.fillStyle='#c8c8c8';
  ctx.beginPath(); ctx.moveTo(36,-4); ctx.lineTo(44,0); ctx.lineTo(36,4); ctx.closePath(); ctx.fill();
  // Étendard
  ctx.fillStyle='#cc2200';
  ctx.beginPath(); ctx.moveTo(18,-4); ctx.lineTo(26,0); ctx.lineTo(18,4); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Barre de charge
  const barW=40;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(x-20,y-58,barW,6,3); ctx.fill();
  if(sp>1.02){
    const filled=Math.min(barW*((sp-1)/2),barW);
    ctx.fillStyle=sp>2.5?'#ff2200':sp>1.8?'#ff8800':'#ffdd00';
    ctx.beginPath(); ctx.roundRect(x-20,y-58,filled,6,3); ctx.fill();
  }
  // Poussière si en charge
  if(sp>1.5){
    for(let i=0;i<5;i++){
      ctx.fillStyle=`rgba(180,140,80,${0.25-i*0.04})`;
      ctx.beginPath(); ctx.arc(x-32-i*9+Math.sin(tk+i)*4,y+22+Math.cos(tk+i)*4,5+i*2,0,6.28); ctx.fill();
    }
  }

} else if(t==='archer'){
  const leg1=walk*6, leg2=-walk*6;
  // Ombre
  ctx.fillStyle='rgba(0,0,0,0.1)';
  ctx.beginPath(); ctx.ellipse(x,y+28,12,3,0,0,6.28); ctx.fill();
  // Jambes
  ctx.fillStyle='#4a2e10'; ctx.beginPath(); ctx.roundRect(x-8,y+8+leg1,7,16,2); ctx.fill();
  ctx.fillStyle='#4a2e10'; ctx.beginPath(); ctx.roundRect(x+1,y+8+leg2,7,16,2); ctx.fill();
  // Bottes
  ctx.fillStyle='#2a1808'; ctx.beginPath(); ctx.roundRect(x-9,y+22+leg1,9,6,2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(x,y+22+leg2,9,6,2); ctx.fill();
  // Cape
  ctx.fillStyle='#3a6a20';
  ctx.beginPath(); ctx.moveTo(x-13,y-10+bob); ctx.lineTo(x+13,y-10+bob); ctx.lineTo(x+10,y+12+bob); ctx.lineTo(x-10,y+12+bob); ctx.closePath(); ctx.fill();
  // Intérieur cape
  ctx.fillStyle='#2a4a18';
  ctx.beginPath(); ctx.moveTo(x-4,y-10+bob); ctx.lineTo(x+4,y-10+bob); ctx.lineTo(x+2,y+12+bob); ctx.lineTo(x-2,y+12+bob); ctx.closePath(); ctx.fill();
  // Capuche
  ctx.fillStyle='#2a5a18';
  ctx.beginPath(); ctx.arc(x,y-21+bob,11,Math.PI,0); ctx.fill();
  ctx.beginPath(); ctx.roundRect(x-11,y-21+bob,22,14,0); ctx.fill();
  // Visage
  ctx.fillStyle='#c8986a'; ctx.beginPath(); ctx.arc(x,y-23+bob,7,0,6.28); ctx.fill();
  // Yeux
  ctx.fillStyle='#3a2a10';
  ctx.beginPath(); ctx.arc(x-3,y-24+bob,1.5,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(x+3,y-24+bob,1.5,0,6.28); ctx.fill();
  // Arc
  const aimY=attacking?-8:0;
  ctx.strokeStyle='#7a5010'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(x+13,y-6+bob+aimY,16,-1.1,1.1); ctx.stroke();
  // Corde
  ctx.strokeStyle='#d0b080'; ctx.lineWidth=1.5;
  const pullBack=attacking?6:0;
  ctx.beginPath();
  ctx.moveTo(x+13,y-22+bob+aimY);
  ctx.lineTo(x+8+pullBack,y-6+bob+aimY);
  ctx.lineTo(x+13,y+10+bob+aimY);
  ctx.stroke();
  // Flèche encochée
  ctx.strokeStyle='#8b6914'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+9+pullBack,y-6+bob+aimY); ctx.lineTo(x+28,y-6+bob+aimY); ctx.stroke();
  ctx.fillStyle='#888';
  ctx.beginPath(); ctx.moveTo(x+26,y-9+bob+aimY); ctx.lineTo(x+32,y-6+bob+aimY); ctx.lineTo(x+26,y-3+bob+aimY); ctx.closePath(); ctx.fill();

} else if(t==='mage'){
  const float=Math.sin(tk*0.09)*4;
  const pulse=Math.sin(tk*0.15)*3;
  // Particules magiques
  for(let i=0;i<5;i++){
    const a=tk*0.07+i*1.256;
    ctx.fillStyle=`rgba(180,0,255,${0.3+i*0.08})`;
    ctx.beginPath(); ctx.arc(x+Math.cos(a)*24,y-8+float+Math.sin(a)*10,2,0,6.28); ctx.fill();
  }

function getUnitSprite(type, animTick, attacking, team){
  // Réduit le tick à un cycle court pour limiter le nombre de variantes en cache
  const frame = Math.floor(animTick / 4) % SPRITE_ANIM_FRAMES;
  const key = type+'|'+(attacking?'a':'w')+'|'+team+'|'+frame;
  let canvas = spriteCache[key];
  if(!canvas){
    canvas = document.createElement('canvas');
    canvas.width = SPRITE_SIZE;
    canvas.height = SPRITE_SIZE;
    const sctx = canvas.getContext('2d');
    renderUnitSprite(sctx, type, SPRITE_CENTER, SPRITE_CENTER, frame, attacking, team, false);
    spriteCache[key] = canvas;
  }
  return canvas;
}

// ==================== FIN SYSTÈME DE SPRITES ====================

class Unit{
constructor(type,team,lane){
const base={
// Combattant équilibré (3)
knight:{hp:150,dmg:9,speed:1.6,range:30,color:'cyan'},

// Distance (4)
archer:{hp:70,dmg:6,speed:1.0,range:200,color:'yellow'},

// Tank (7)
giant:{hp:750,dmg:6,speed:0.40,range:35,color:'purple'},

// Boss volant (10)
dragon:{hp:420,dmg:22,speed:1.3,range:230,color:'red'},

// Défenseur (4)
guardian:{hp:300,dmg:5,speed:0.7,range:30,color:'steelblue'},

// Soutien (5)
healer:{hp:100,dmg:0,speed:1.15,range:90,color:'lime'},

// Mage (6)
mage:{hp:150,dmg:16,speed:1.0,range:180,color:'violet'},

// Sniper (7)
sniper:{hp:80,dmg:22,speed:0.8,range:320,color:'green'},

// Assassin (4)
ninja:{hp:80,dmg:14,speed:2.5,range:30,color:'white'},

// Suicide (4)
kamikaze:{hp:60,dmg:90,speed:1.9,range:30,color:'orange'},
electromancer:{hp:130,dmg:20,speed:1.0,range:180,color:'cyan'},
cryomancer:{hp:150,dmg:12,speed:1.0,range:260,color:'lightblue'},
pyromancer:{hp:120,dmg:18,speed:1.0,range:190,color:'orange'},
mole:{hp:900,dmg:50,speed:0.9,range:35,color:'black'},
cavalier:{hp:220,dmg:16,speed:2.0,range:35,color:'sienna'}
}[type];

let lv=levels[type]||1;
if(team==='enemy'){
 const aiLvMap={1:3,2:5,3:10,4:15,5:20,6:25,7:30,8:35,9:40,10:50};
 const aiLevel=aiForced ? aiDifficulty : autoAIDifficulty();
 lv=aiLvMap[Math.min(10,Math.max(1,aiLevel))]||1;
}
this.hp=Math.round(base.hp*(1+0.15*(lv-1)));
this.maxHp=this.hp;
this.dmg=base.dmg*(1+0.15*(lv-1));
this.speed=base.speed; this.range=base.range; this.color=base.color;
this.level=lv; this.type=type; this.team=team; this.lane=lane; this.charge=0;
this.x=team==='player'?180:1020;
const baseY=lane?435:215;
// Répartition verticale à l'arrivée : évite que plusieurs unités identiques
// se superposent parfaitement (c'était le côté "bizarre" signalé en jeu).
const nearby=(typeof unitsArr!=='undefined'?unitsArr:[]).filter(u=>u.team===team && u.lane===lane && Math.abs(u.x-this.x)<50);
const spreadOffsets=[0,34,-34,68,-68,100,-100];
this.y=baseY+(spreadOffsets[nearby.length] ?? (Math.random()*140-70));
this.cool=0; this.burnTime=0; this.slowTime=0; this.electricTime=0; this.burrow=type==='mole'?120:0; this.burrowCd=360;
}
update(){
if(this.type==='mole'){
 if(this.burrow>0){
   this.burrow--;
   this.x += this.team==='player'?2.5:-2.5;

   let targets=unitsArr.filter(u=>u.team!==this.team && u.lane===this.lane);
   let priority=['healer','sniper','cryomancer','pyromancer','mage','electromancer'];
   targets.sort((a,b)=>{
      let pa=priority.indexOf(a.type); if(pa<0) pa=99;
      let pb=priority.indexOf(b.type); if(pb<0) pb=99;
      return pa-pb;
   });

   let near=targets.find(u=>Math.abs(u.x-this.x)<35);
   if(!near){
      let priorityTarget=targets.find(u=>Math.abs(u.x-this.x)<250);
      if(priorityTarget){
         this.x += (priorityTarget.x>this.x?5:-5);
      }
   }else{
      this.burrow=0;
   }

   if(this.burrow===0){
      unitsArr.forEach(u=>{
         if(u.team!==this.team && u.lane===this.lane && Math.abs(u.x-this.x)<60){u.hp-=130*(1+0.05*((this.level||1)-1));}
      });
   }
   return;
 }
 this.burrowCd--;
 if(this.burrowCd<=0){ this.burrow=90; this.burrowCd=360; return; }
}
// === CAVALIER CHARGE ===
if(this.type==='cavalier'){
  const dir=this.team==='player'?1:-1;
  if(!this.chargeSpeed) this.chargeSpeed=this.speed;

  // Chercher l'ennemi le plus proche devant
  let closest=9999;
  for(let i=0;i<unitsArr.length;i++){
    const u=unitsArr[i];
    if(u.team===this.team||u.lane!==this.lane||u.hp<=0) continue;
    const dist=dir===1?(u.x-this.x):(this.x-u.x);
    if(dist>0&&dist<350&&dist<closest) closest=dist;
  }

  // Accélération lisse : augmente si voie libre, décélère doucement sinon
  if(closest>100){
    // Voie libre : accélérer progressivement (lerp vers vitesse max)
    const target=this.speed*3.0;
    this.chargeSpeed += (target-this.chargeSpeed)*0.025; // transition douce
  } else if(closest>this.range){
    // Ennemi proche mais pas au contact : maintenir vitesse (ne pas stopper)
    // Légère décélération pour préparer l'impact
    const target=this.speed*1.2;
    this.chargeSpeed += (target-this.chargeSpeed)*0.05;
  }

  // Contact ennemi
  const contact=unitsArr.find(u=>u!==this&&u.team!==this.team&&u.lane===this.lane&&u.hp>0&&Math.abs(u.x-this.x)<this.range);
  if(contact){
    if(this.cool<=0){
      const sr=this.chargeSpeed/this.speed;
      const dmg=Math.round(this.dmg*(1+(sr-1)*3.0));
      for(let i=0;i<unitsArr.length;i++){
        const u=unitsArr[i];
        if(u.team!==this.team&&u.lane===this.lane&&u.hp>0&&Math.abs(u.x-this.x)<80) u.hp-=dmg;
      }
      // Décélération lisse après impact (pas de reset brutal)
      this.chargeSpeed=this.speed*0.8;
      this.cool=20;
    }
    // Ne pas bouger pendant le cooldown de frappe
  } else {
    // Impact château
    const castle=this.team==='player'?enemy:player;
    if(Math.abs(this.x-(castle.x+45))<60&&this.cool<=0){
      const sr=this.chargeSpeed/this.speed;
      castle.hp-=Math.round(10+(sr-1)/2*28);
      this.chargeSpeed=this.speed*0.8;
      this.cool=20;
    } else {
      // Toujours avancer (jamais s'arrêter pendant la charge)
      const mv=this.slowTime>0?this.chargeSpeed*0.6:this.chargeSpeed;

draw(){
const t=this.type, x=this.x, y=this.y;
const dir=this.team==='player'?1:-1;
const tk=this.animTick||0;
const attacking=this._attacking||false;

// Taupe creusant : animation spéciale dynamique
if(t==='mole'&&this.burrow>0){
  ctx.save();
  if(dir===-1){ctx.translate(x*2,0);ctx.scale(-1,1);}
  ctx.fillStyle='#5a3818';
  ctx.beginPath();ctx.ellipse(x,y+22,22,6,0,0,6.28);ctx.fill();
  for(let i=0;i<5;i++){
    const a=i*1.25+tk*0.2;
    ctx.fillStyle=`rgba(100,65,30,${0.6-i*0.08})`;
    ctx.beginPath();ctx.arc(x+Math.cos(a)*16,y+16+Math.sin(a)*8,4,0,6.28);ctx.fill();
  }
  ctx.restore();
  // Jauge
  const ratio=this.burrow/90;
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(x-20,y-12,40,7,3);ctx.fill();
  ctx.fillStyle='#8b4513';ctx.beginPath();ctx.roundRect(x-20,y-12,40*ratio,7,3);ctx.fill();
  return;
}

// Récupérer les frames pré-chargées
const imgs = UNIT_IMGS[t];
if(imgs){
  const anim = attacking ? imgs.a : imgs.w;
  const speed = attacking ? 10 : 7;
  const fi = Math.floor(tk/speed) % anim.length;
  const img = anim[fi];
  const sizes = {
    cavalier:190, dragon:190, mole:170, giant:165,
    knight:145, guardian:145, archer:145, mage:145,
    healer:138, ninja:138, pyromancer:145, kamikaze:135,
    sniper:148, cryomancer:145, electromancer:145
  };
  const sz = sizes[t] || 145;

  ctx.save();
  if(dir===-1){
    ctx.translate(x,y);
    ctx.scale(-1,1);
    if(img.complete&&img.naturalWidth>0)
      ctx.drawImage(img,-sz/2,-sz/2,sz,sz);
  } else {
    if(img.complete&&img.naturalWidth>0)
      ctx.drawImage(img,x-sz/2,y-sz/2,sz,sz);
  }
  ctx.restore();
} else {
  // Fallback cercle pour types inconnus
  ctx.fillStyle='#888';
  ctx.beginPath();ctx.arc(x,y,15,0,6.28);ctx.fill();
}

// Barre de charge cavalier (dynamique)
if(t==='cavalier'){
  const sp=(this.chargeSpeed||this.speed)/this.speed;
  if(sp>1.02){
    const barW=40, filled=Math.min(barW*((sp-1)/2),barW);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(x-20,y-50,barW,6,3);ctx.fill();
    ctx.fillStyle=sp>2.5?'#ff2200':sp>1.8?'#ff8800':'#ffdd00';
    ctx.beginPath();ctx.roundRect(x-20,y-50,filled,6,3);ctx.fill();
  }
}

// Jauge cooldown taupe (dynamique)
if(t==='mole'&&this.burrow<=0){
  const ratio=1-(this.burrowCd/360);
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(x-20,y-46,40,6,3);ctx.fill();
  ctx.fillStyle=ratio>0.8?'#cc4400':ratio>0.5?'#ff8800':'#8b4513';
  ctx.beginPath();ctx.roundRect(x-20,y-46,40*ratio,6,3);ctx.fill();
}

// Barre de vie
const bw=38, bh=5, hr=Math.max(0,this.hp/(this.maxHp||1));
ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.roundRect(x-bw/2-1,y-46,bw+2,bh+2,3);ctx.fill();
ctx.fillStyle='#333';ctx.beginPath();ctx.roundRect(x-bw/2,y-45,bw,bh,2);ctx.fill();
ctx.fillStyle=hr>0.6?'#22dd55':hr>0.3?'#ffaa00':'#ee2222';
ctx.beginPath();ctx.roundRect(x-bw/2,y-45,bw*hr,bh,2);ctx.fill();

// Effets statut
if(this.burnTime>0){
  for(let i=0;i<3;i++){
    ctx.fillStyle=i%2?'#ff6600':'#ff2200';ctx.globalAlpha=0.6+Math.random()*0.3;
    ctx.beginPath();ctx.arc(x-10+Math.random()*20,y+Math.random()*16,3,0,6.28);ctx.fill();
    ctx.globalAlpha=1;
  }
}
if(this.slowTime>0){ctx.fillStyle='rgba(80,180,255,0.18)';ctx.beginPath();ctx.arc(x,y,24,0,6.28);ctx.fill();}
if(this.electricTime>0){
  ctx.strokeStyle='rgba(255,255,0,0.7)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x+Math.random()*24-12,y-18);ctx.lineTo(x+Math.random()*24-12,y+8);ctx.stroke();
}
}
}

   const p=allowed.filter(u=>unitMeta[u].role===role && !deck.includes(u));

 };

 pick('offense');

 while(deck.length<6){

   if(!deck.includes(u)) deck.push(u);
 }
 return deck;

function drawCastle(c, col){
  const x=c.x, y=c.y, w=c.w, h=c.h;
  const isPlayer = col==='blue';
  const tick = _now/80;
  const hpRatio = Math.max(0, c.hp/c.maxHp);

  const wallCol   = isPlayer ? '#2a3a6a' : '#5a1a1a';
  const wallDark  = isPlayer ? '#1a2a50' : '#3a0a0a';
  const wallLight = isPlayer ? '#3a4a8a' : '#7a2a2a';
  const flagCol   = isPlayer ? '#4488ff' : '#ff4422';
  const bannerCol = isPlayer ? '#2266cc' : '#cc2200';

  // Tours latérales (simples rectangles, pas de clip)
  ctx.fillStyle=wallDark;
  ctx.fillRect(x-8,y-10,22,h+18);
  ctx.fillStyle=wallLight;
  ctx.fillRect(x-6,y-8,18,h+14);
  ctx.fillStyle=wallDark;
  ctx.fillRect(x+w-14,y-10,22,h+18);
  ctx.fillStyle=wallLight;
  ctx.fillRect(x+w-12,y-8,18,h+14);

  // Créneaux tours
  ctx.fillStyle=wallDark;
  for(let i=0;i<3;i++){
    ctx.fillRect(x-8+i*8,y-20,6,12);
    ctx.fillRect(x+w-14+i*8,y-20,6,12);
  }

  // Mur principal
  ctx.fillStyle=wallCol;
  ctx.fillRect(x+6,y,w-12,h);
  // Texture rapide (4 lignes horizontales)
  ctx.fillStyle=wallDark;
  for(let row=0;row<4;row++){
    const oy=y+8+row*18;
    for(let col2=0;col2<4;col2++){
      ctx.fillRect(x+8+col2*22+(row%2?10:0),oy,18,12);
    }
  }

  // Créneaux principaux
  for(let i=0;i<5;i++) ctx.fillRect(x+8+i*14,y-16,10,18);

  // Porte (arc simplifié en rectangles)
  ctx.fillStyle='#111';
  const gx=x+w/2-12, gy=y+h-44;
  ctx.fillRect(gx,gy,24,28);
  ctx.beginPath();ctx.arc(gx+12,gy,12,Math.PI,0);ctx.fill();
  // Herse rapide (2 lignes)
  ctx.fillStyle='#333';
  for(let i=0;i<3;i++) ctx.fillRect(gx+3+i*8,gy-10,3,30);

  // Drapeau (1 mât + 1 rect)
  if(c.hp>0){
    const fx=x+w/2, fy=y-30;
    ctx.fillStyle='#888'; ctx.fillRect(fx-1,fy-28,3,30);
    ctx.fillStyle=flagCol;
    // Flag simple sans quadratique
    const wave=Math.sin(tick*0.1)*4;
    ctx.fillRect(fx+1,fy-26,18+wave,14);
  }

  // Bannières (2 rectangles)
  ctx.fillStyle=bannerCol;
  ctx.fillRect(x+2,y+10,12,28);
  ctx.fillRect(x+w-14,y+10,12,28);

  // Dégâts visuels (seulement si vraiment abîmé)
  if(hpRatio<0.5){
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(x+14,y+18,10,8);
    if(hpRatio<0.25) ctx.fillRect(x+w-28,y+22,8,7);
  }
  if(hpRatio<0.3){
    // Fumée légère (2 cercles max)
    const sy=y-10-((tick*0.4)%40);
    const alpha=Math.max(0,0.4-((tick*0.4)%40)/80);
    ctx.fillStyle=`rgba(80,80,80,${alpha})`;
    ctx.beginPath();ctx.arc(x+w/2,sy,8,0,6.28);ctx.fill();
  }
  if(hpRatio<0.15&&hpRatio>0){
    ctx.fillStyle=tick%2>1?'#ff6600':'#ffaa00';
    ctx.fillRect(x+w/2-8,y+h-10,16,8);
  }

  // Barre de vie
  const bw=w+10, bx=x-5, by=y+h+14;
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(bx-1,by-1,bw+2,10);
  ctx.fillStyle='#333'; ctx.fillRect(bx,by,bw,8);
  ctx.fillStyle=hpRatio>0.6?'#22dd55':hpRatio>0.3?'#ffaa00':'#ee2222';
  ctx.fillRect(bx,by,bw*hpRatio,8);
  ctx.fillStyle='white'; ctx.font='bold 10px Arial'; ctx.textAlign='center';
  ctx.fillText(Math.max(0,Math.ceil(c.hp))+'/'+c.maxHp, x+w/2, by+20);
}

    weatherParticles.push({
      x:Math.random()*1200, y:Math.random()*650,
      speed:weatherType==='snow'?0.5+Math.random():7+Math.random()*4,
      drift:(Math.random()-0.5)*(weatherType==='snow'?0.8:0.3),
      size:weatherType==='snow'?2+Math.random()*2:1
    });
  }
}
function drawWeather(){
  weatherTimer--;
  if(weatherTimer<=0) initWeather();
  if(weatherType==='sun'){
    ctx.fillStyle='rgba(255,240,180,0.03)';
    ctx.fillRect(0,0,1200,650);
    return;
  }
  ctx.save();
  if(weatherType==='rain'||weatherType==='storm'){
    // Tout en un seul path = beaucoup plus rapide
    ctx.strokeStyle=weatherType==='storm'?'rgba(160,180,230,0.4)':'rgba(180,200,255,0.28)';
    ctx.lineWidth=1.2; ctx.lineCap='round';
    ctx.beginPath();
    for(let i=0;i<weatherParticles.length;i++){
      const p=weatherParticles[i];
      ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x+p.drift*3,p.y+12);
      p.y+=p.speed; p.x+=p.drift;
      if(p.y>650){p.y=-10;p.x=Math.random()*1200;}
      if(p.x<0)p.x=1200; if(p.x>1200)p.x=0;
    }
    ctx.stroke();
    if(weatherType==='storm'){
      ctx.fillStyle='rgba(10,10,25,0.1)';
      ctx.fillRect(0,0,1200,650);
      lightningTimer--;
      if(lightningTimer<=0&&Math.random()<0.015){lightningFlash=6;lightningTimer=120+Math.random()*200;}
      if(lightningFlash>0){ctx.fillStyle='rgba(255,255,255,'+(lightningFlash*0.07)+')';ctx.fillRect(0,0,1200,650);lightningFlash--;}
    }
  } else if(weatherType==='snow'){
    // Neige en un seul path fill aussi
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.beginPath();
    for(let i=0;i<weatherParticles.length;i++){
      const p=weatherParticles[i];
      ctx.moveTo(p.x+p.size,p.y);
      ctx.arc(p.x,p.y,p.size,0,6.28);
      p.y+=p.speed; p.x+=p.drift;
      if(p.y>650){p.y=-10;p.x=Math.random()*1200;}
    }
    ctx.fill();
  }
  ctx.restore();
}

let endAnimParticles=[];

function startEndAnimation(type){
  if(endAnimActive) return;
  endAnimActive=true;
  endAnimType=type;
  endAnimParticles=[];
  if(type==='victory'){
    for(let i=0;i<100;i++){
      endAnimParticles.push({
        x: Math.random()*1200, y: -20-Math.random()*400,
        vx: (Math.random()-0.5)*2, vy: 2+Math.random()*3,
        color: ['#ffd700','#ff4477','#44ddff','#88ff44','#ff8844'][Math.floor(Math.random()*5)],
        rot: Math.random()*6.28, vrot:(Math.random()-0.5)*0.3,
        size: 4+Math.random()*4
      });
    }
    // Quelques confettis déjà visibles dès la première frame
    for(let i=0;i<25;i++){
      endAnimParticles.push({
        x: Math.random()*1200, y: Math.random()*400,
        vx: (Math.random()-0.5)*2, vy: 2+Math.random()*3,
        color: ['#ffd700','#ff4477','#44ddff','#88ff44','#ff8844'][Math.floor(Math.random()*5)],
        rot: Math.random()*6.28, vrot:(Math.random()-0.5)*0.3,
        size: 4+Math.random()*4
      });
    }
  } else {
    // Défaite : débris qui tombent du château ennemi côté joueur
    for(let i=0;i<30;i++){
      endAnimParticles.push({
        x: player.x+Math.random()*player.w, y: player.y+Math.random()*player.h,
        vx:(Math.random()-0.5)*4, vy:-2-Math.random()*3,
        color:'#555', rot:0, vrot:(Math.random()-0.5)*0.2,
        size:5+Math.random()*6
      });
    }
  }
}

function drawEndAnimation(){
  if(!endAnimActive) return;
  ctx.save();
  if(endAnimType==='victory'){
    ctx.fillStyle='rgba(255,215,0,0.06)';
    ctx.fillRect(0,0,1200,650);
  } else {
    ctx.fillStyle='rgba(100,0,0,0.08)';
    ctx.fillRect(0,0,1200,650);
  }
  endAnimParticles.forEach(p=>{
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.color;
    if(endAnimType==='victory'){
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    } else {
      ctx.beginPath(); ctx.roundRect(-p.size/2,-p.size/2,p.size,p.size,2); ctx.fill();
    }
    ctx.restore();
    p.x+=p.vx; p.y+=p.vy;
    if(endAnimType==='victory'){ p.vy+=0.05; p.rot+=p.vrot; }
    else { p.vy+=0.15; p.rot+=p.vrot; }
  });
  // Nettoyage particules hors écran
  endAnimParticles = endAnimParticles.filter(p=>p.y<700 && p.y>-300);
  ctx.restore();
}

function resetEndAnimation(){
  endAnimActive=false;
  endAnimType=null;
  endAnimParticles=[];
}

// Charger session sauvegardée + toujours revérifier avec Supabase (empêche
// une vieille copie locale de "survivre" à une remise à zéro côté serveur)
async function loadSession(){
  try {
    const saved = localStorage.getItem('mc_session');
    if(saved) currentUser = JSON.parse(saved);
  } catch(e) {}
  updateAccountUI();

  if(currentUser && currentUser.id){
    try{
      const res = await fetch(SUPA_URL + 'players?id=eq.' + currentUser.id + '&select=*', {
        headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY}
      });
      const data = await res.json();
      if(data && data.length > 0){
        const user = data[0];
        points = user.points || 0;
        wins = user.wins || 0;
        losses = user.losses || 0;
        if(user.progression){
          try{
            const prog = JSON.parse(user.progression);
            if(prog.points !== undefined) points = prog.points;
            if(prog.diamonds !== undefined) diamonds = prog.diamonds;
            if(prog.levels) levels = {...levels, ...prog.levels};
            if(prog.equipped) equipped = prog.equipped;
            if(prog.unlocked) unlocked = prog.unlocked;
          }catch(e){}
        }
        saveGame();
        if(typeof renderUnits==='function') renderUnits();
      } else {
        // Le compte n'existe plus côté serveur (supprimé) : on déconnecte
        currentUser = null;
        localStorage.removeItem('mc_session');
        updateAccountUI();
      }
    }catch(e){
      // Pas de réseau : on garde la copie locale en dépannage, mais elle
      // sera re-synchronisée dès que la connexion reviendra.
    }
  }
}

function hashPwd(pwd){
  // Encodage simple mais cohérent - évite les problèmes de caractères spéciaux
  let h = 0;
  const str = 'mc_' + pwd;
  for(let i=0;i<str.length;i++){
    h = ((h<<5)-h)+str.charCodeAt(i);
    h = h&h;
  }
  return 'h' + Math.abs(h).toString(36);
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  
  if(!email || !password){ msg.textContent = '⚠️ Remplis tous les champs'; return; }
  msg.textContent = '⏳ Connexion...'; msg.style.color='#aaa';
  
  try {
    const res = await fetch(SUPA_URL + 'players?email=eq.' + encodeURIComponent(email) + '&select=*', {
      headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY}
    });
    const data = await res.json();
    if(data && data.length > 0){
      const user = data[0];
      // Vérifier mot de passe
      if(user.password !== hashPwd(password)){
        msg.style.color='#f66'; msg.textContent = '❌ Mot de passe incorrect';
        return;
      }
      saveSession({id: user.id, pseudo: user.pseudo, email: user.email, tag: user.tag});
      // Charger la progression
      if(user.progression) try {
        const prog = JSON.parse(user.progression);
        if(prog.points !== undefined) points = prog.points;
        if(prog.levels) levels = {...levels, ...prog.levels};
        if(prog.diamonds !== undefined) diamonds = prog.diamonds;
      } catch(e){}
      closeAccountModal();
      saveGame();
      updateAccountUI();
    } else {
      msg.style.color='#f66'; msg.textContent = '❌ Aucun compte avec cet email';
    }
  } catch(e) {
    msg.style.color='#f66'; msg.textContent = '❌ Erreur réseau, réessaie';
    console.error(e);
  }
}

// ========== SUPPORT TACTILE COMPLET ==========
let touchStartX=0, touchStartY=0, touchStartTime=0;

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t=e.touches[0];
  const r=canvas.getBoundingClientRect();
  touchStartX=(t.clientX-r.left)*(1200/r.width);
  touchStartY=(t.clientY-r.top)*(650/r.height);
  touchStartTime=Date.now();
}, {passive:false});

canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  if(gameOver) return;
  const t=e.changedTouches[0];
  const r=canvas.getBoundingClientRect();
  const x=(t.clientX-r.left)*(1200/r.width);
  const y=(t.clientY-r.top)*(650/r.height);
  const dt=Date.now()-touchStartTime;
  const dx=x-touchStartX, dy=y-touchStartY;
  
  // Swipe vertical = changer de lane
  if(Math.abs(dy)>40 && Math.abs(dy)>Math.abs(dx) && dt<400){
    if(dy<0 && selectedLane>0) selectedLane--;
    if(dy>0 && selectedLane<1) selectedLane++;
    return;
  }
  // Tap court = simuler un click
  if(dt<300 && Math.abs(dx)<20 && Math.abs(dy)<20){
    const fakeClick=new MouseEvent('click',{bubbles:true});
    Object.defineProperty(fakeClick,'clientX',{value:t.clientX});
    Object.defineProperty(fakeClick,'clientY',{value:t.clientY});
    canvas.dispatchEvent(fakeClick);
  }
}, {passive:false});

// Support clavier (PC)
document.addEventListener('keydown', e=>{
  if(gameOver) return;
  const keys={'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'ArrowUp':-1,'ArrowDown':-1};
  if(e.key==='ArrowUp'&&selectedLane>0){ selectedLane--; e.preventDefault(); }
  if(e.key==='ArrowDown'&&selectedLane<1){ selectedLane++; e.preventDefault(); }
  // Touche 1-6 pour spawner unité rapide
  const idx=parseInt(e.key)-1;
  if(!isNaN(idx)&&idx>=0&&idx<equipped.length){
    spawn(equipped[idx]); e.preventDefault();
  }
});
